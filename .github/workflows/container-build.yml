name: C2-Lite Lab container build

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "server.py"
      - "requirements.txt"
      - ".github/workflows/container-build.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "server.py"
      - "requirements.txt"
      - ".github/workflows/container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Build controller image
        run: docker build --tag c2-lite-lab:ci .
